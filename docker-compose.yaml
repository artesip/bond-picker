networks:
  network:
    driver: bridge

volumes:
  bond_picker_postgres_data:

services:
  web:
    build: web
    container_name: bond-picker-web
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - database
    restart: always

  backend:
    build: backend
    container_name: bond-picker-backend
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - database
    restart: always

  traefik:
    image: traefik:v3.6
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--entrypoints.web.address=:80"
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
    ports:
      - "80:80"
      - "8000:8080"
    volumes:
      - ./dynamic.yml:/etc/traefik/dynamic.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    restart: always

  database:
    image: postgres:18.2
    container_name: bond-picker-database
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "127.0.0.1:5434:5432"
    networks:
      - network
    volumes:
      - bond_picker_postgres_data:/var/lib/postgresql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always
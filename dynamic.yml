http:
  routers:
    react:
      rule: "Host(`localhost`)"
      service: react-svc
      entryPoints:
        - web
      middlewares:
#        - redirect-https

#    react-https:
#      rule: "Host(`localhost`)"
#      service: react-svc
#      entryPoints:
#        - websecure
#      tls: {}

    backend:
      rule: "Host(`localhost`) && PathPrefix(`/backend`)"
      service: backend-svc
      entryPoints:
        - web
      middlewares:
        - strip-backend

  middlewares:
#    redirect-https:
#      redirectScheme:
#        scheme: https
#        permanent: true

    strip-backend:
      stripPrefix:
        prefixes:
          - "/backend"

  services:
    react-svc:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:3000"

    backend-svc:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:8080"

